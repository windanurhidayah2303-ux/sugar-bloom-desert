<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sugar Bloom Dessert</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
      *{margin:0;padding:0;box-sizing:border-box}
      body{font-family:'Poppins',sans-serif;overflow-x:hidden}

      /* ===== NAVBAR - POLA TEMENMU ===== */
      .navbar{position:absolute;top:0;left:0;right:0;z-index:100;background:transparent}
      .nav-container{display:flex;justify-content:space-between;align-items:flex-start;padding:18px 22px}
      .logo{font-family:'Playfair Display';font-weight:700;font-size:18px;line-height:1.1;color:#fff;letter-spacing:1px}
      .logo span{color:#D7B68F}
      .menu-button{font-size:28px;background:none;border:none;cursor:pointer;color:#fff;padding:5px 10px}

      .nav-menu{position:fixed;inset:0;background:#2B1A14;display:none;flex-direction:column;align-items:center;justify-content:center;gap:6px;z-index:200}
      .nav-menu.open{display:flex}
      .nav-menu a{text-decoration:none;color:#FFF8F0;font-size:18px;font-weight:500;padding:14px 40px;border-radius:10px;width:85%;max-width:360px;text-align:center}
      .nav-menu a.active{background:#D7B68F;color:#2B1A14;font-weight:600}

      /* ===== HERO - PUNYA KAMU TETEP DIPAKE ===== */
      .hero{min-height:100vh;background:linear-gradient(rgba(0,0,0,.35), rgba(0,0,0,.35)), url('images/cake-selection.jpeg');background-size:cover;background-position:center;display:flex;flex-direction:column;justify-content:center;padding:110px 22px 40px;color:#fff;position:relative}
      .welcome{letter-spacing:4px;font-size:13px;font-weight:600}
      .hero h1{font-family:'Playfair Display';font-size:48px;line-height:1.1;margin:16px 0;font-weight:500}
      .subtitle{font-size:17px;line-height:1.6;max-width:320px;opacity:.95}
      .buttons{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap}
      .button{padding:13px 24px;text-decoration:none;font-size:12px;font-weight:600;letter-spacing:1px;background:#fff;color:#5D4037}
      .view-dessert{padding:13px 24px;text-decoration:none;font-size:12px;font-weight:600;letter-spacing:1px;border:1.5px solid #fff;color:#fff}
      .qr-code{position:absolute;right:20px;bottom:20px;width:90px;height:90px;border-radius:10px;background:#fff;padding:5px}

      @media(min-width:851px){
        .nav-container{padding:20px 45px}
        .menu-button{display:none}
        .nav-menu{position:static;display:flex !important;flex-direction:row;background:none;gap:8px;justify-content:flex-end}
        .nav-menu a{color:#fff;font-size:11px;letter-spacing:1.5px;padding:7px 12px;width:auto}
        .nav-menu a.active{background:#fff;color:#5D4037}
        .hero{padding:110px 60px 40px}
        .hero h1{font-size:72px}
        .qr-code{width:110px;height:110px;right:40px;bottom:40px}
      }
    </style>
</head>
<body>

    <!-- NAVIGATION - UDAH DIGANTI PAKE POLA TEMENMU -->
    <header class="navbar">
        <div class="nav-container">
            <div class="logo">
                SUGAR BLOOM<br>
                <span>DESSERT</span>
            </div>

            <button class="menu-button" onclick="toggleMenu()">☰</button>

            <nav class="nav-menu" id="navMenu">
                <a href="home.html" class="active">Home</a>
                <a href="our-story.html">Our Story</a>
                <a href="our-menu.html">Our Menu</a>
                <a href="contact.html">Contact</a>
                <a href="location.html">Location</a>
                <a href="sweet-offers.html">Sweet Offers</a>
                <a href="thanks.html">Thanks</a>
            </nav>
        </div>
    </header>

    <!-- HOME -->
    <section class="hero">
        <div class="hero-content">
            <p class="welcome">WELCOME TO</p>

            <h1>
                Sweet Moments in Every<br>
                Bite
            </h1>

            <p class="subtitle">
                Where every dessert tells a sweet story
            </p>

            <div class="buttons">
                <a href="our-menu.html" class="button">EXPLORE MENU</a>
                <a href="our-menu.html" class="view-dessert">VIEW DESSERT</a>
            </div>
        </div>

        <!-- QR CODE -->
        <img src="images/qrcode.jpeg" class="qr-code" alt="QR Code">
    </section>

<script>
function toggleMenu(){
  document.getElementById('navMenu').classList.toggle('open');
}
</script>

</body>
</html>
