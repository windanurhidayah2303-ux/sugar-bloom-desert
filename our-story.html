<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SUGAR BLOOM DESSERT</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Poppins',sans-serif}
.navbar{position:absolute;top:0;left:0;right:0;z-index:100}
.nav-container{display:flex;justify-content:space-between;align-items:flex-start;padding:18px 22px}
.logo{font-family:'Playfair Display';font-weight:700;font-size:18px;line-height:1.1;color:#fff}
.logo span{color:#D7B68F}
.menu-button{font-size:28px;background:none;border:none;color:#fff;cursor:pointer;padding:5px 10px}
.nav-menu{position:fixed;inset:0;background:#2B1A14;display:none;flex-direction:column;align-items:center;justify-content:center;gap:6px;z-index:200}
.nav-menu.open{display:flex}
.nav-menu a{text-decoration:none;color:#FFF8F0;font-size:18px;padding:14px 40px;border-radius:10px;width:85%;max-width:360px;text-align:center}
.nav-menu a.active{background:#D7B68F;color:#2B1A14;font-weight:600}
.hero{min-height:100vh;background:linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.35)),url('https://images.unsplash.com/photo-1551024506-0bccd828d307?q=80&w=1200&auto=format&fit=crop');background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;text-align:center;padding:100px 20px 40px}
.hero h1{font-family:'Playfair Display';color:#fff;font-size:38px;line-height:1.2}
.hero p{color:#fff;margin:16px 0 28px;font-weight:300}
.btn{display:inline-block;padding:13px 24px;border-radius:30px;text-decoration:none;font-weight:600;font-size:14px;margin:5px}
.btn-coklat{background:#D7B68F;color:#2B1A14}
.btn-putih{background:#fff;color:#5D4037}
@media(min-width:851px){
.menu-button{display:none}
.nav-menu{position:static;display:flex!important;flex-direction:row;background:none;gap:5px}
.nav-menu a{color:#fff;font-size:11px;letter-spacing:1px;padding:7px 12px;width:auto}
.nav-menu a.active{background:#fff;color:#5D4037}
.hero h1{font-size:56px}
}
</style>
</head>
<body>
<header class="navbar"><div class="nav-container">
<div class="logo">SUGAR BLOOM<br><span>DESSERT</span></div>
<button class="menu-button" onclick="toggleMenu()">☰</button>
<nav class="nav-menu" id="navMenu">
<a href="home.html" class="active">Home</a>
<a href="our-story.html">Our Story</a>
<a href="our-menu.html">Our Menu</a>
<a href="contact.html">Contact</a>
<a href="location.html">Location</a>
<a href="sweet-offers.html">Sweet Offers</a>
<a href="thanks.html">Thanks</a>
</nav></div></header>
<section class="hero"><div>
<h1>Sweet Moments<br>in Every Bite</h1>
<p>Handcrafted desserts made with love, for your sweetest moments.</p>
<a class="btn btn-coklat" href="our-menu.html">EXPLORE MENU</a>
<a class="btn btn-putih" href="our-story.html">VIEW DESSERT</a>
</div></section>
<script>function toggleMenu(){document.getElementById('navMenu').classList.toggle('open')}</script>
</body>
</html>
